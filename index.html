<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TESTE – Sorteio Dia das Crianças – Diversões Maracanã</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#ffcc00,#ff6f3c);min-height:100vh;color:#222}
    .card{background:#fff;max-width:420px;margin:24px auto;padding:24px 20px;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
    .logo{display:block;width:210px;max-width:72%;height:auto;margin:0 auto 10px}
    h1{font-size:22px;margin:0 0 4px;color:#e4002b;text-align:center}
    h2{font-size:15px;margin:0 0 18px;color:#555;font-weight:normal;text-align:center}
    label{display:block;font-weight:bold;margin:14px 0 6px;font-size:15px}
    input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:2px solid #ddd;border-radius:10px}
    input:focus{border-color:#0057b8;outline:none}
    input[readonly]{background:#eee;color:#333;caret-color:transparent;pointer-events:none}
    button{width:100%;margin-top:20px;padding:15px;font-size:19px;font-weight:bold;color:#fff;background:#0057b8;border:0;border-radius:12px;cursor:pointer}
    button:disabled{opacity:.6}
    .insta{text-align:center;margin:0 0 16px;font-size:15px}
    .insta a{color:#0057b8;font-weight:bold;text-decoration:none}
    .aviso{font-size:12px;color:#666;margin-top:14px;line-height:1.4}
    .lgpd{font-size:11px;color:#777;margin:12px 0 0;line-height:1.45}
    .erro{color:#c00;font-weight:bold;margin-top:12px;min-height:1.2em}
    .ok{text-align:center}
    .emoji{font-size:48px}
    .selo{position:fixed;top:8px;right:8px;background:#c00;color:#fff;font:bold 12px Arial;padding:4px 8px;border-radius:6px}
    iframe{position:absolute;width:0;height:0;border:0;opacity:0}
  </style>
</head>
<body>
  <div class="selo">TESTE</div>
  <div class="card" id="card"></div>
  <iframe name="sorteio-envio" title="envio"></iframe>
  <script>
    (function () {
      var BACKEND = "https://script.google.com/macros/s/AKfycbwrjViORpef9nKtOsJUQQO1XPCfLCv_-O3i7zYKZ7NUngDJ0iosF-gSJ0qs3lAG-I6tcg/exec";
      var INSTAGRAM = "@diversoesmaracana";
      var INSTAGRAM_URL = "https://www.instagram.com/diversoesmaracana";
      var DDDS = {11:1,12:1,13:1,14:1,15:1,16:1,17:1,18:1,19:1,21:1,22:1,24:1,27:1,28:1,31:1,32:1,33:1,34:1,35:1,37:1,38:1,41:1,42:1,43:1,44:1,45:1,46:1,47:1,48:1,49:1,51:1,53:1,54:1,55:1,61:1,62:1,63:1,64:1,65:1,66:1,67:1,68:1,69:1,71:1,73:1,74:1,75:1,77:1,79:1,81:1,82:1,83:1,84:1,85:1,86:1,87:1,88:1,89:1,91:1,92:1,93:1,94:1,95:1,96:1,97:1,98:1,99:1};
      var card = document.getElementById("card");
      var params = new URLSearchParams(location.search);
      var c = (params.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (c.indexOf("TST") === 0) c = c.substring(3);
      var code = c ? ("TST-" + c) : "";

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
        });
      }

      function soDigitos(v) { return String(v || "").replace(/\D/g, ""); }

      function normalizarWhats(v) {
        var d = soDigitos(v);
        if (d.length > 11 && d.indexOf("55") === 0) d = d.substring(2);
        return d.slice(0, 11);
      }

      function dddValido(d) { return !!(DDDS[Number(String(d).slice(0, 2))]); }

      function formatarWhats(v) {
        var d = soDigitos(v);
        if (d.length > 11 && d.indexOf("55") === 0) d = d.substring(2);
        d = d.slice(0, 11);
        if (d.length <= 2) return d;
        if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
        if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
        return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
      }

      function mostrarResultado(r) {
        if (r && r.ok) {
          card.className = "card ok";
          card.innerHTML =
            "<img class=logo src=logo.png alt='Diversões Maracanã'>" +
            "<div class=emoji>🎉</div><h1>Você está concorrendo" + (r.nome ? ", " + esc(r.nome) : "") + "!</h1>" +
            "<p>Seu número da sorte é</p><p style='font-size:44px;font-weight:bold;color:#0057b8;margin:6px 0'>" + esc(r.numero) + "</p>" +
            "<p>Código do cupom: <b>" + esc(r.codigo) + "</b></p>" +
            "<p>O sorteio será ao vivo no Instagram <a href='" + INSTAGRAM_URL + "' target=_blank rel=noopener>" + INSTAGRAM + "</a>.</p>" +
            "<p>Se você ganhar, avisaremos pelo WhatsApp. Tire um print desta tela! 📸</p>" +
            "<p class=aviso>Diversões Maracanã – TESTE Dia das Crianças</p>";
          return;
        }
        var btn = document.getElementById("btn");
        if (btn) { btn.disabled = false; btn.textContent = "Quero concorrer!"; }
        var erro = document.getElementById("erro");
        if (erro) erro.textContent = (r && r.msg) || "Não foi possível enviar. Tente de novo.";
        if (r && r.titulo && r.titulo !== "Confira seu nome" && r.titulo !== "Confira seu WhatsApp" && r.titulo !== "Muita gente ao mesmo tempo") {
          card.className = "card ok";
          card.innerHTML = "<img class=logo src=logo.png alt='Diversões Maracanã'><div class=emoji>⚠️</div><h1>" + esc(r.titulo) + "</h1><p>" + esc(r.msg) + "</p>";
        }
      }

      if (!code) {
        card.className = "card ok";
        card.innerHTML = "<img class=logo src=logo.png alt='Diversões Maracanã'><div class=emoji>⚠️</div><h1>Escaneie o QR do cupom</h1><p>Abra esta página pelo QR do cupom de teste.</p>";
        return;
      }

      card.innerHTML =
        "<img class=logo src=logo.png alt='Diversões Maracanã'>" +
        "<h1>Sorteio Dia das Crianças</h1>" +
        "<h2>Preencha e concorra!</h2>" +
        "<p class=insta><a href='" + INSTAGRAM_URL + "' target=_blank rel=noopener>" + INSTAGRAM + "</a></p>" +
        "<form id=f method=POST target=sorteio-envio action='" + BACKEND + "'>" +
        "<input type=hidden name=acao value=sorteio>" +
        "<label>Código do cupom</label>" +
        "<input name=codigo value='" + esc(code) + "' readonly tabindex=-1>" +
        "<label for=nome>Seu nome</label>" +
        "<input id=nome name=nome autocomplete=name required minlength=3 placeholder='Nome e sobrenome'>" +
        "<label for=whats>WhatsApp (com DDD)</label>" +
        "<input id=whats name=whatsapp type=tel inputmode=numeric autocomplete=tel required maxlength=15 placeholder='(21) 99999-9999'>" +
        "<button id=btn type=submit>Quero concorrer!</button>" +
        "<div id=erro class=erro></div>" +
        "<p class=lgpd>* Ao clicar em Quero concorrer, você declara ser maior de 18 anos ou responsável legal pelo participante e autoriza a Diversões Maracanã a tratar seu nome e WhatsApp somente para esta inscrição e para avisar o ganhador, nos termos da Lei nº 13.709/2018 (LGPD). Os dados não serão vendidos nem usados para outra finalidade. Para acessar, corrigir ou excluir suas informações, fale com a bilheteria.</p>" +
        "</form>";

      var whats = document.getElementById("whats");
      whats.addEventListener("beforeinput", function (ev) {
        if (ev.data && /\D/.test(ev.data) && !/[\s()+-]/.test(ev.data)) ev.preventDefault();
      });
      whats.addEventListener("input", function () {
        var d = soDigitos(whats.value);
        if (d.length > 11 && d.indexOf("55") === 0) d = d.substring(2);
        whats.value = formatarWhats(d.slice(0, 11));
      });
      whats.addEventListener("keypress", function (ev) {
        if (!/[0-9]/.test(ev.key) && ev.key.length === 1) ev.preventDefault();
      });
      whats.addEventListener("paste", function (ev) {
        ev.preventDefault();
        whats.value = formatarWhats((ev.clipboardData || window.clipboardData).getData("text"));
      });

      window.addEventListener("message", function (ev) {
        if (!ev.data || ev.data.origem !== "sorteio") return;
        mostrarResultado(ev.data.resultado);
      });

      document.getElementById("f").addEventListener("submit", function (ev) {
        var d = normalizarWhats(whats.value);
        if (d.length !== 11) {
          ev.preventDefault();
          document.getElementById("erro").textContent = "Está faltando algum dígito. Digite o DDD e o número com 11 dígitos.";
          return;
        }
        if (!dddValido(d)) {
          ev.preventDefault();
          document.getElementById("erro").textContent = "Esse DDD não é válido. Confira os 2 primeiros números.";
          return;
        }
        whats.value = d;
        document.getElementById("btn").disabled = true;
        document.getElementById("btn").textContent = "Enviando...";
        setTimeout(function () {
          var btn = document.getElementById("btn");
          if (btn && btn.disabled) {
            btn.disabled = false;
            btn.textContent = "Quero concorrer!";
            document.getElementById("erro").textContent = "Demorou para responder. Tente de novo.";
          }
        }, 20000);
      });
    })();
  </script>
</body>
</html>
